<div style="background:#FBE8EE;padding:32px 16px;font-family:Arial,Helvetica,sans-serif;color:#2A1E27">
  <div style="max-width:440px;margin:0 auto;background:#ffffff;border-radius:24px;padding:28px 24px;text-align:center">
    <img src="https://lashbox.app/pwa-192.png" width="64" height="64" alt="LashBox" style="display:block;margin:0 auto 10px;border:0">
    <div style="font-size:20px;font-weight:700;margin-bottom:18px">LashBox</div>
    <div style="font-size:24px;font-weight:700;line-height:1.2;margin-bottom:10px">Seu acesso chegou 💕</div>
    <div style="font-size:16px;line-height:1.5;color:#7A6C75;margin-bottom:24px">Toque no botão abaixo para entrar no app.</div>
    <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#5B2A4E;color:#ffffff;text-decoration:none;font-weight:700;font-size:17px;padding:16px 32px;border-radius:999px">Entrar no LashBox</a>
    <div style="font-size:14px;line-height:1.5;color:#7A6C75;margin:28px 0 8px">Está usando o app instalado na tela inicial? Digite este código no app:</div>
    <div style="font-size:30px;font-weight:700;letter-spacing:6px;color:#5B2A4E">{{ .Token }}</div>
    <div style="font-size:12px;color:#8E808A;margin-top:24px">O link e o código valem por 1 hora. Se você não pediu este acesso, ignore este e-mail.</div>
  </div>
</div>
