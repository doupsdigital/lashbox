# For detailed configuration reference documentation, visit:
# https://supabase.com/docs/guides/local-development/cli/config
project_id = "lashbox"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[auth]
enabled = true
site_url = "http://localhost:5190"
additional_redirect_urls = ["http://localhost:5190/", "http://127.0.0.1:5190/"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = false
enable_anonymous_sign_ins = false
enable_manual_linking = false

[auth.rate_limit]
email_sent = 2

[auth.email]
enabled = true
double_confirm_changes = true
enable_confirmations = false
secure_password_change = false
max_frequency = "1s"
otp_length = 8
otp_expiry = 3600

[auth.email.template.magic_link]
subject = "Seu acesso ao LashBox"
content_path = "./supabase/templates/link-magico.html"

[edge_runtime]
enabled = true
policy = "per_worker"
deno_version = 2

[functions.request-login]
verify_jwt = false

[functions.kiwify-webhook]
verify_jwt = false
